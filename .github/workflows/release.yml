# Push a tag such as v1.2.0 (matching kVersion in main/app_main.cc) to:
#   1. build the firmware,
#   2. publish a GitHub Release with the binaries,
#   3. deploy the browser installer + ota.json to GitHub Pages, which the
#      devices check for updates.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. v1.2.0"
        required: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.2
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Check version
        id: ver
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          CODE=$(sed -n 's/.*kVersion\[\] = "\(.*\)";/\1/p' main/app_main.cc)
          if [ "$VERSION" != "$CODE" ]; then
            echo "::error::Tag $TAG does not match kVersion $CODE in main/app_main.cc"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target esp32s3
          idf.py build
          cd build
          python -m esptool --chip esp32s3 merge_bin -o hkbus-note4-full.bin @flash_args
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            build/zectrix_hkbus_board.bin
            build/hkbus-note4-full.bin

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: fw
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Get esptool-js for the installer
        run: |
          mkdir -p /tmp/ejs && cd /tmp/ejs
          npm init -y >/dev/null
          npm install --no-audit --no-fund esptool-js@0.7.0
      - id: pages
        uses: actions/configure-pages@v5
      - name: Assemble site
        env:
          VERSION: ${{ needs.build.outputs.version }}
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          NOTES=$(git tag -l --format='%(contents:subject)' "v$VERSION" 2>/dev/null || true)
          python3 scripts/make_site.py fw site "$BASE_URL" "$VERSION" "$NOTES"
          mkdir -p site/vendor
          cp /tmp/ejs/node_modules/esptool-js/bundle.js site/vendor/esptool.js
          cp /tmp/ejs/node_modules/esptool-js/LICENSE site/vendor/ESPTOOL_JS_LICENSE.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          cp fw/hkbus-note4-full.bin "hkbus-note4-v$VERSION-full.bin"
          cp fw/zectrix_hkbus_board.bin "hkbus-note4-v$VERSION-app.bin"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" hkbus-note4-v$VERSION-*.bin site/firmware/ota.json --clobber
          else
            gh release create "v$VERSION" hkbus-note4-v$VERSION-*.bin site/firmware/ota.json \
              --title "v$VERSION" \
              --notes "安裝：用電腦版 Chrome 開啟 ${{ steps.deploy.outputs.page_url }}。已安裝的顯示屏可在手機設定頁按「檢查更新」。"
          fi
