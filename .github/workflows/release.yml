# Publishes a release whenever main contains a version (kVersion in
# main/app_main.cc) that has no GitHub Release yet:
#   1. build the firmware,
#   2. create the GitHub Release (and its vX.Y.Z tag) with the binaries,
#   3. deploy the browser installer + ota.json to GitHub Pages, which the
#      devices check for updates.
# To release: change kVersion, push to main.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      new: ${{ steps.ver.outputs.new }}
    steps:
      - uses: actions/checkout@v4
      - name: Is this version released yet?
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/.*kVersion\[\] = "\(.*\)";/\1/p' main/app_main.cc)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION already released"
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.new == 'true'
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.2
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target esp32s3
          idf.py build
          cd build
          python -m esptool --chip esp32s3 merge_bin -o hkbus-note4-full.bin @flash_args
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            build/zectrix_hkbus_board.bin
            build/hkbus-note4-full.bin

  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: fw
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Get esptool-js for the installer
        run: |
          mkdir -p /tmp/ejs && cd /tmp/ejs
          npm init -y >/dev/null
          npm install --no-audit --no-fund esptool-js@0.7.0
      - id: pages
        uses: actions/configure-pages@v5
      - name: Assemble site
        env:
          VERSION: ${{ needs.check.outputs.version }}
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          NOTES=$(git log -1 --format=%s)
          python3 scripts/make_site.py fw site "$BASE_URL" "$VERSION" "$NOTES"
          mkdir -p site/vendor
          cp /tmp/ejs/node_modules/esptool-js/bundle.js site/vendor/esptool.js
          cp /tmp/ejs/node_modules/esptool-js/LICENSE site/vendor/ESPTOOL_JS_LICENSE.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          cp fw/hkbus-note4-full.bin "hkbus-note4-v$VERSION-full.bin"
          cp fw/zectrix_hkbus_board.bin "hkbus-note4-v$VERSION-app.bin"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" hkbus-note4-v$VERSION-*.bin site/firmware/ota.json --clobber
          else
            gh release create "v$VERSION" hkbus-note4-v$VERSION-*.bin site/firmware/ota.json \
              --target "$GITHUB_SHA" --title "v$VERSION" \
              --notes "安裝：用電腦版 Chrome 開啟 ${{ steps.deploy.outputs.page_url }}。已安裝的顯示屏可在手機設定頁按「檢查更新」。"
          fi
